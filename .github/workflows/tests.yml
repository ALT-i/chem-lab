name: Tests

on: [push]

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:13.3
        env:
          POSTGRES_DB: db
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v2
      - name: Set up Python 3.9
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          # celery 4.4.7 declares `pytz>dev`, a non-PEP-440 specifier that
          # pip >= 23.3 refuses to consider -- it reports "No matching
          # distribution found" while still listing 4.4.7 as available, and
          # the install dies before any test runs. Pin pip below that cutoff
          # so CI resolves the same way the Docker image does.
          # Removing this pin requires upgrading celery to >= 5.2 (which also
          # means bumping django-celery-beat, kombu, billiard and amqp).
          python -m pip install 'pip<23.3'
          pip install -r requirements/dev.txt
      - name: Run Tests
        run: python manage.py test
        env:
          DB_NAME: db
          DB_USER: admin
          DB_PASSWORD: admin
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
